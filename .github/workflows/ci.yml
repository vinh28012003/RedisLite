name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build redis-lite (builder stage for tests + final image)
        run: |
          docker build -f docker/Dockerfile --target builder -t redis-lite:builder .
          docker compose -f docker/docker-compose.yml build

      - name: Run unit tests
        run: |
          docker run --rm redis-lite:builder \
            ctest --test-dir build --output-on-failure

      - name: Run integration tests
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 2
          pip install -r tests/requirements.txt
          pytest tests/integration/ -v
          docker compose -f docker/docker-compose.yml down

  build-and-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Go controller
        working-directory: controller
        run: go build ./...

      - name: Run Go unit tests
        working-directory: controller
        run: go test -tags=unit ./... -v -timeout 30s

  failover-tests:
    runs-on: ubuntu-latest
    needs: [build-and-test-cpp, build-and-test-go]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build failover compose
        run: docker compose -f docker/docker-compose.failover.yml build

      - name: Start failover topology
        run: docker compose -f docker/docker-compose.failover.yml up -d

      - name: Wait for all nodes to respond to PING
        run: |
          for port in 6379 6380 6381 6382 6383; do
            echo "Waiting for port $port..."
            timeout 30 bash -c "until echo -e '*1\r\n\$4\r\nPING\r\n' | nc -w1 127.0.0.1 $port | grep -q PONG; do sleep 1; done"
            echo "Port $port: ready"
          done

      - name: Verify replication topology
        run: |
          echo -e '*2\r\n$4\r\nINFO\r\n$11\r\nreplication\r\n' | nc -w2 127.0.0.1 6379 | grep -q "role:master"
          echo "redis-1: master OK"
          for port in 6380 6381 6382 6383; do
            echo -e '*2\r\n$4\r\nINFO\r\n$11\r\nreplication\r\n' | nc -w2 127.0.0.1 $port | grep -q "role:worker"
            echo "Port $port: replica OK"
          done

      - name: Verify controller is running
        run: |
          docker compose -f docker/docker-compose.failover.yml logs failover-ctl | grep -q "Starting monitor"
          echo "Controller: running OK"

      - name: Run failover tests
        run: |
          pip install -r tests/requirements.txt
          pytest tests/failover/ -v --timeout=60

      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.failover.yml down -v
