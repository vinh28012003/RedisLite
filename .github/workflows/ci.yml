name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build redis-lite
        run: docker compose -f docker/docker-compose.yml build

      - name: Run unit tests
        run: |
          docker compose -f docker/docker-compose.yml run --rm redis-lite \
            ctest --test-dir build --output-on-failure

      - name: Run integration tests
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 2
          pip install -r tests/requirements.txt
          pytest tests/integration/ -v
          docker compose -f docker/docker-compose.yml down

  build-and-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Go controller
        working-directory: controller
        run: go build ./...

      - name: Run Go unit tests
        working-directory: controller
        run: go test -tags=unit ./... -v -timeout 30s

  failover-tests:
    runs-on: ubuntu-latest
    needs: [build-and-test-cpp, build-and-test-go]
    steps:
      - uses: actions/checkout@v4

      - name: Build failover compose
        run: docker compose -f docker/docker-compose.failover.yml build

      - name: Start failover topology
        run: |
          docker compose -f docker/docker-compose.failover.yml up -d
          sleep 10

      - name: Verify all nodes respond to PING
        run: |
          for port in 6379 6380 6381 6382 6383; do
            echo "Checking port $port..."
            timeout 5 bash -c "echo -e '*1\r\n\$4\r\nPING\r\n' | nc -w2 127.0.0.1 $port | grep -q PONG"
            echo "Port $port: OK"
          done

      - name: Verify replication topology
        run: |
          echo -e '*2\r\n$4\r\nINFO\r\n$11\r\nreplication\r\n' | nc -w2 127.0.0.1 6379 | grep -q "role:master"
          echo "redis-1: master OK"
          for port in 6380 6381 6382 6383; do
            echo -e '*2\r\n$4\r\nINFO\r\n$11\r\nreplication\r\n' | nc -w2 127.0.0.1 $port | grep -q "role:worker"
            echo "Port $port: replica OK"
          done

      - name: Verify controller is running
        run: |
          docker compose -f docker/docker-compose.failover.yml logs failover-ctl | grep -q "Starting monitor"
          echo "Controller: running OK"

      - name: Run failover tests
        if: hashFiles('tests/failover/conftest.py') != ''
        run: |
          pip install pytest
          pip install -r tests/failover/requirements.txt 2>/dev/null || true
          pytest tests/failover/ -v --timeout=60

      - name: Teardown
        if: always()
        run: docker compose -f docker/docker-compose.failover.yml down -v
