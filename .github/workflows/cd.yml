name: CD

# Triggers:
# 1. Push to main (after PR merge) → tags with 'latest' + short SHA
# 2. Version tag (v*) → tags with the version number
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Docker tags must be all-lowercase; github.repository preserves original casing
      - name: Lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Compute image tags based on trigger type:
      # main push → latest + sha-abc1234
      # tag push  → v1.2.3
      - name: Compute tags
        id: tags
        run: |
          SERVER="ghcr.io/$REPO/redis-lite"
          CTL="ghcr.io/$REPO/failover-ctl"
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/}"
            echo "server_tags=$SERVER:$VERSION" >> "$GITHUB_OUTPUT"
            echo "ctl_tags=$CTL:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "server_tags=$SERVER:latest,$SERVER:sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "ctl_tags=$CTL:latest,$CTL:sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ steps.repo.outputs.name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}

      # Build + push redis-lite server (multi-stage, runtime image only)
      - name: Build and push redis-lite
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          cache-from: type=gha,scope=redis-lite
          cache-to: type=gha,mode=max,scope=redis-lite

      # Build + push failover controller  (multi-stage)
      - name: Build and push failover-ctl
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: controller/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.ctl_tags }}
          cache-from: type=gha,scope=failover-ctl
          cache-to: type=gha,mode=max,scope=failover-ctl

      - name: Print pushed images
        run: |
          echo "Server tags: $SERVER_TAGS"
          echo "Controller tags: CTL_TAGS"
        env:
          SERVER_TAGS: ${{ steps.tags.outputs.server_tags }}
          CTL_TAGS: ${{ steps.tags.outputs.ctl_tags }}

      # Future steps (Phase 8 — Terraform/EKS):
      # - Deploy to EKS
      # - Post-deploy validation
