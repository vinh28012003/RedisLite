name: CD

# Build production images on every merge to main.
# Evolves into: build → push ECR → deploy EKS → post-deploy validation.

on:
  push:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build redis-lite image
        run: docker build -f docker/Dockerfile -t redis-lite:latest .

      - name: Build failover controller image
        run: docker build -f controller/Dockerfile -t failover-ctl:latest .

      - name: Verify images created
        run: |
          docker images redis-lite:latest --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker images failover-ctl:latest --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Future steps (after Terraform/EKS):
      # - name: Push to ECR
      #   run: docker push $ECR_REGISTRY/redis-lite:$SHA
      # - name: Deploy to EKS
      #   run: kubectl rollout restart ...
      # - name: Post-deploy validation
      #   run: pytest tests/failover/ against live K8s
